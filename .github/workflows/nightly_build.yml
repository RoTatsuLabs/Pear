name: Nightly build

on:
  push:
    branches: [nightly]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the changelog
        run: python3 .github/scripts/validate_changelog.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Signing is optional here. Without the secrets the build still runs and
      # produces an unsigned release APK.
      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PEAR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pear.jks"
            echo "PEAR_KEYSTORE_FILE=$RUNNER_TEMP/pear.jks" >> "$GITHUB_ENV"
          fi

      - name: Build the release APK
        env:
          PEAR_KEYSTORE_PASSWORD: ${{ secrets.PEAR_KEYSTORE_PASSWORD }}
          PEAR_KEY_ALIAS: ${{ secrets.PEAR_KEY_ALIAS }}
          PEAR_KEY_PASSWORD: ${{ secrets.PEAR_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PpearVersionName="nightly-${GITHUB_SHA::7}" \
            -PpearVersionCode="${GITHUB_RUN_NUMBER}"

      - uses: actions/upload-artifact@v4
        with:
          name: pear-nightly-${{ github.run_number }}
          path: app/build/outputs/apk/release/*
          if-no-files-found: error
          retention-days: 30
