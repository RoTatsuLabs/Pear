# Builds Pear on every push to nightly and uploads the APKs as Actions artifacts.
# Releases are handled separately by release_build.yml.
name: Nightly Build

on:
  push:
    branches:
      - nightly
    paths:
      - '**'
      - '!**.md'
      - 'changelogs.md'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Sign & Upload
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Android SDK
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Check the changelog
        run: python3 .github/scripts/validate_changelog.py

      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PEAR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pear.jks"
            echo "PEAR_KEYSTORE_FILE=$RUNNER_TEMP/pear.jks" >> "$GITHUB_ENV"
            echo "PEAR_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "PEAR_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
          fi

      - name: Set nightly version
        run: echo "VERSION_TAG=nightly-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build the release APKs
        env:
          PEAR_KEYSTORE_PASSWORD: ${{ secrets.PEAR_KEYSTORE_PASSWORD }}
          PEAR_KEY_ALIAS: ${{ secrets.PEAR_KEY_ALIAS }}
          PEAR_KEY_PASSWORD: ${{ secrets.PEAR_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PpearVersionName="${VERSION_TAG}" \
            -PpearVersionCode="${GITHUB_RUN_NUMBER}"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Publish test report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6
        if: success() || failure()
        with:
          include_passed: true
          detailed_summary: true
          report_paths: '**/build/test-results/test*/TEST-*.xml'

      - name: Verify APK signatures
        if: env.PEAR_SIGNING_ENABLED == 'true'
        run: |
          set -e
          dir="app/build/outputs/apk/release"
          count=0
          while IFS= read -r apk; do
            echo "Verifying $apk"
            "${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner" verify "$apk"
            count=$((count + 1))
          done < <(find "$dir" -maxdepth 1 -type f -name '*.apk' | sort)
          if [ "$count" -ne 5 ]; then
            echo "::error::Expected 5 release APKs, found $count" >&2
            exit 1
          fi

      - name: Rename APKs
        run: |
          set -e
          dir="app/build/outputs/apk/release"
          find_apk() {
            local abi="$1"
            local file
            file="$(find "$dir" -maxdepth 1 -type f -name "app-${abi}-release*.apk" | head -n1)"
            if [ -z "$file" ]; then
              echo "::error::Missing $abi release APK in $dir" >&2
              exit 1
            fi
            printf '%s\n' "$file"
          }
          universal="$(find "$dir" -maxdepth 1 -type f -name 'app-universal-release*.apk' | head -n1)"
          if [ -z "$universal" ]; then
            echo "::error::Missing universal release APK in $dir" >&2
            exit 1
          fi
          mv "$universal" "pear-${VERSION_TAG}.apk"
          mv "$(find_apk arm64-v8a)" "pear-arm64-v8a-${VERSION_TAG}.apk"
          mv "$(find_apk armeabi-v7a)" "pear-armeabi-v7a-${VERSION_TAG}.apk"
          mv "$(find_apk x86)" "pear-x86-${VERSION_TAG}.apk"
          mv "$(find_apk x86_64)" "pear-x86_64-${VERSION_TAG}.apk"

      - name: Upload universal APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pear-nightly-universal-${{ env.VERSION_TAG }}
          path: pear-${{ env.VERSION_TAG }}.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pear-nightly-arm64-v8a-${{ env.VERSION_TAG }}
          path: pear-arm64-v8a-${{ env.VERSION_TAG }}.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pear-nightly-armeabi-v7a-${{ env.VERSION_TAG }}
          path: pear-armeabi-v7a-${{ env.VERSION_TAG }}.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload x86 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pear-nightly-x86-${{ env.VERSION_TAG }}
          path: pear-x86-${{ env.VERSION_TAG }}.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload x86_64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pear-nightly-x86_64-${{ env.VERSION_TAG }}
          path: pear-x86_64-${{ env.VERSION_TAG }}.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload R8 mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release
          if-no-files-found: error
          retention-days: 14
