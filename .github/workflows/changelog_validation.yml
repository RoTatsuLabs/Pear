name: Changelog validation

on:
  push:
    branches: [master, nightly]
    paths:
      - changelogs.md
      - .github/scripts/validate_changelog.py
  pull_request:
    branches: [master, nightly]
    paths:
      - changelogs.md
      - .github/scripts/validate_changelog.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate changelogs.md
        run: python3 .github/scripts/validate_changelog.py
